name: Bad Chinese reply
description: 报告一条像客服、接错上下文或假装完成的回复
title: "[Bad reply]: "
body:
  - type: textarea
    id: user_goal
    attributes:
      label: 用户当时真正要什么
      description: 用一句话说明正确任务或意图。
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 必要上下文
      description: 只保留复现问题所需的脱敏内容。
    validations:
      required: true
  - type: textarea
    id: reply
    attributes:
      label: Agent 的回复
      description: 可用等义改写保护隐私。
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 具体问题
      description: 它是复述、模板腔、接错改口、风格串线，还是假装完成？
    validations:
      required: true
  - type: textarea
    id: direction
    attributes:
      label: 更好的处理方向
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我没有提交私人聊天截图、账号或可识别个人的信息。
          required: true
