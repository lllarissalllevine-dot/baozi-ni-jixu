<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">同一仓库，三个独立 Skill</title>
  <desc id="desc">宝子你继续、我的妈呀大姐和柏拉图三个可以独立安装，并约定单轮只采用一种风格的中文对话 Skill</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101522"/>
      <stop offset="1" stop-color="#1b2131"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".25"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="32" fill="url(#bg)"/>
  <text x="70" y="78" fill="#98a4ba" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="23" font-weight="600">NATIVE CHINESE DIALOGUE SKILLS</text>
  <text x="70" y="137" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="44" font-weight="760">同一仓库，三个独立 Skill</text>
  <text x="70" y="180" fill="#aab3c3" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="23">单独安装 · 单轮单风格 · 同一份 Star</text>

  <g filter="url(#shadow)">
    <rect x="70" y="228" width="335" height="280" rx="25" fill="#202a3b" stroke="#40516c"/>
    <rect x="433" y="228" width="335" height="280" rx="25" fill="#342428" stroke="#86434d"/>
    <rect x="796" y="228" width="335" height="280" rx="25" fill="#302638" stroke="#71476d"/>
  </g>

  <circle cx="115" cy="280" r="18" fill="#70a7ff"/>
  <text x="148" y="290" fill="#9fc2ff" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="700">NORMAL</text>
  <text x="105" y="365" fill="#f4f7fb" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="35" font-weight="700">宝子你继续</text>
  <text x="105" y="418" fill="#9fc2ff" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20">baozi-ni-jixu</text>

  <circle cx="478" cy="280" r="18" fill="#ff6e7c"/>
  <text x="511" y="290" fill="#ff9ba4" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="700">TOXIC</text>
  <text x="468" y="365" fill="#fff5f6" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="35" font-weight="700">我的妈呀大姐</text>
  <text x="468" y="418" fill="#ff9ba4" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19">wo-de-ma-ya-da-jie</text>

  <circle cx="841" cy="280" r="18" fill="#f08ecb"/>
  <text x="874" y="290" fill="#f5add9" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="700">LOVER</text>
  <text x="831" y="365" fill="#fff5fb" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="35" font-weight="700">柏拉图</text>
  <text x="831" y="418" fill="#f5add9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20">plato</text>
</svg>
